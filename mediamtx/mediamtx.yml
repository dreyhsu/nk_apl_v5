logLevel: info
logDestinations: [stdout]

rtsp: false
rtmp: false
srt: false
moq: false

hls: true
hlsAddress: :8888
hlsVariant: lowLatency

webrtc: true
webrtcAddress: :8889
webrtcLocalUDPAddress: :8189

# IPs advertised to the browser as WebRTC ICE host candidates. Keep the address
# that the viewer PC uses to reach this SmartCam. If the board IP changes and
# WebRTC signaling succeeds but video stays black, update this list.
webrtcAdditionalHosts: [169.254.130.130]

paths:
  smartcam:
    source: udp+rtp://127.0.0.1:5004
    rtpSDP: |
      v=0
      o=- 0 0 IN IP4 127.0.0.1
      s=SmartCam H264
      c=IN IP4 127.0.0.1
      t=0 0
      m=video 5004 RTP/AVP 96
      a=rtpmap:96 H264/90000
      a=fmtp:96 packetization-mode=1

logLevel: info
logDestinations: [stdout]

rtsp: false
rtmp: false
srt: false
moq: false
hls: false

webrtc: true
webrtcAddress: :8889
webrtcLocalUDPAddress: ""
webrtcLocalTCPAddress: :5000
webrtcAdditionalHosts: [192.168.50.212]

paths:
  smartcam:
    source: udp+rtp://127.0.0.1:5004
    rtpSDP: |
      v=0
      o=- 0 0 IN IP4 127.0.0.1
      s=SmartCam APL H264
      c=IN IP4 127.0.0.1
      t=0 0
      m=video 5004 RTP/AVP 96
      a=rtpmap:96 H264/90000
      a=fmtp:96 packetization-mode=1
